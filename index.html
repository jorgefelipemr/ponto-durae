<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório DurAE - Ponto</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 380px; }
    h2 { margin-top: 0; color: #333; text-align: center; font-size: 20px; }
    .status { padding: 10px; border-radius: 4px; font-size: 14px; margin-bottom: 15px; text-align: center; font-weight: bold; }
    .ok { background-color: #d4edda; color: #155724; }
    .erro { background-color: #f8d7da; color: #721c24; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 18px; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #msg { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Laboratório DurAE</h2>
    <div id="statusBox" class="status">Verificando rede Wi-Fi...</div>

    <form id="pontoForm" style="display: none;">
      <label for="nome">Aluno:</label>
      <select id="nome" required>
        <option value="">Carregando lista de alunos...</option>
      </select>

      <label for="tipo">Registro:</label>
      <select id="tipo" required>
        <option value="Entrada">Entrada</option>
        <option value="Saída">Saída</option>
      </select>

      <button type="button" id="btnEnviar" onclick="enviarPonto()">Registrar Horário</button>
    </form>
    
    <div id="msg"></div>
  </div>

  <script>
    // ================= CONFIGURAÇÕES =================
    const IP_LABORATORIO = "200.131.207.11"; // Ex: "200.145.45.10"
    const URL_DO_SCRIPT = "https://script.google.com/macros/s/AKfycbxh5z3Yp045YuWltIEDKspY0LQmWlaJFVHjqIB0AtuFstsZr0EOeDP_3237xFThEfN5/exec"; // Termina em /exec
    const URL_CSV_ALUNOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS6EWp6vZQ07ZZUYLexoIW84Tj3TXhmi4fZd6MepzzWL-KoU3TkqytMigVV7bacdwff7bkC4Y08y6-3/pub?gid=1854097096&single=true&output=csv"; // Link que termina em output=csv
    // =================================================

    let userIp = "";

    window.onload = async function() {
      const statusBox = document.getElementById("statusBox");
      try {
        // 1. Pega o IP do aluno
        const resIp = await fetch('https://api.ipify.org?format=json');
        const dataIp = await resIp.json();
        userIp = dataIp.ip;

        // 2. Valida o Wi-Fi
        if (userIp === IP_LABORATORIO) {
          statusBox.className = "status ok";
          statusBox.innerText = "Conectado ao Wi-Fi do Laboratório ✓";
          document.getElementById("pontoForm").style.display = "block";
          
          // 3. Puxa os nomes da planilha
          carregarAlunosDaPlanilha();
        } else {
          statusBox.className = "status erro";
          statusBox.innerText = "Acesso Bloqueado: Conecte-se ao Wi-Fi do Laboratório DurAE para registrar.";
        }
      } catch (err) {
        statusBox.className = "status erro";
        statusBox.innerText = "Erro ao identificar conexão com a internet.";
      }
    };

    async function carregarAlunosDaPlanilha() {
      try {
        // Adiciona timestamp para evitar cache e sempre pegar o nome mais recente
        const res = await fetch(URL_CSV_ALUNOS + '&t=' + new Date().getTime());
        const texto = await res.text();
        
        // Separa as linhas do CSV
        const linhas = texto.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        
        // Remove a primeira linha se for o cabeçalho "Nome"
        if (linhas.length > 0 && linhas[0].toLowerCase().includes("nome")) {
          linhas.shift();
        }

        const select = document.getElementById("nome");
        select.innerHTML = '<option value="">Selecione seu nome...</option>';

        linhas.forEach(nomeLimpo => {
          // Remove aspas caso o Google coloque
          const nomeFinal = nomeLimpo.replace(/^"|"$/g, '').trim();
          if (nomeFinal) {
            const opt = document.createElement("option");
            opt.value = nomeFinal;
            opt.innerText = nomeFinal;
            select.appendChild(opt);
          }
        });
      } catch (e) {
        const select = document.getElementById("nome");
        select.innerHTML = '<option value="">Erro ao carregar nomes</option>';
      }
    }

    function enviarPonto() {
      const nome = document.getElementById("nome").value;
      const tipo = document.getElementById("tipo").value;
      const btn = document.getElementById("btnEnviar");
      const msg = document.getElementById("msg");

      if (!nome) {
        alert("Por favor, selecione seu nome.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Registrando...";

      const img = new Image();
      const query = `?nome=${encodeURIComponent(nome)}&tipo=${encodeURIComponent(tipo)}&ip=${encodeURIComponent(userIp)}&t=${new Date().getTime()}`;
      img.src = URL_DO_SCRIPT + query;

      setTimeout(function() {
        msg.style.color = "green";
        msg.innerText = "Ponto registrado com sucesso!";
        document.getElementById("nome").value = "";
        btn.disabled = false;
        btn.innerText = "Registrar Horário";
      }, 1000);
    }
  </script>
</body>
</html>
