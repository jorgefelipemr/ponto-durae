<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório DurAE - Ponto</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 380px; }
    h2 { margin-top: 0; color: #333; text-align: center; font-size: 20px; }
    .status { padding: 10px; border-radius: 4px; font-size: 14px; margin-bottom: 15px; text-align: center; font-weight: bold; }
    .ok { background-color: #d4edda; color: #155724; }
    .erro { background-color: #f8d7da; color: #721c24; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 18px; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Laboratório DurAE</h2>
    <div id="statusBox" class="status">Validando conexão com Wi-Fi...</div>

    <form id="pontoForm" style="display: none;">
      <label for="nome">Aluno:</label>
      <select id="nome" required>
        <option value="">Carregando...</option>
      </select>

      <label for="tipo">Registro:</label>
      <select id="tipo" required>
        <option value="Entrada">Entrada</option>
        <option value="Saída">Saída</option>
      </select>

      <button type="button" id="btnEnviar" onclick="enviarPonto()">Registrar Horário</button>
    </form>
    
    <div id="msgFinal" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>

  <script>
    // COLE AQUI A URL DO SEU APPS SCRIPT (TERMINADA EM /exec)
    const API_URL = "https://script.google.com/macros/s/AKfycbxh5z3Yp045YuWltIEDKspY0LQmWlaJFVHjqIB0AtuFstsZr0EOeDP_3237xFThEfN5/exec"; 
    
    let userIp = "";
    let ipPermitido = "";

    window.onload = async function() {
      const statusBox = document.getElementById("statusBox");
      try {
        // 1. Obtém o IP do aluno
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        userIp = ipData.ip;

        // 2. Chama os dados via JSONP (burlar restrição CORS do navegador)
        const script = document.createElement('script');
        script.src = `${API_URL}?callback=carregarDadosLab`;
        document.body.appendChild(script);

      } catch (err) {
        statusBox.className = "status erro";
        statusBox.innerText = "Erro ao identificar rede de internet.";
      }
    };

    // Callback disparado quando o Google responde
    function carregarDadosLab(data) {
      const statusBox = document.getElementById("statusBox");
      ipPermitido = data.ipEsperado;

      if (userIp === ipPermitido) {
        statusBox.className = "status ok";
        statusBox.innerText = "Conectado à rede do laboratório ✓";
        
        const select = document.getElementById("nome");
        select.innerHTML = '<option value="">Selecione seu nome...</option>';
        data.alunos.forEach(nome => {
          const opt = document.createElement("option");
          opt.value = nome;
          opt.innerText = nome;
          select.appendChild(opt);
        });

        document.getElementById("pontoForm").style.display = "block";
      } else {
        statusBox.className = "status erro";
        statusBox.innerText = "Acesso Bloqueado: Conecte-se ao Wi-Fi do Laboratório DurAE.";
      }
    }

    async function enviarPonto() {
      const nome = document.getElementById("nome").value;
      const tipo = document.getElementById("tipo").value;
      const btn = document.getElementById("btnEnviar");
      const msg = document.getElementById("msgFinal");

      if (!nome) {
        alert("Por favor, selecione seu nome.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Registrando...";

      const formData = new URLSearchParams();
      formData.append("nome", nome);
      formData.append("tipo", tipo);
      formData.append("ip", userIp);

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: formData.toString()
        });

        msg.style.color = "green";
        msg.innerText = "Ponto registrado com sucesso!";
        document.getElementById("nome").value = "";
      } catch (e) {
        msg.style.color = "red";
        msg.innerText = "Erro ao registrar horário.";
      }

      btn.disabled = false;
      btn.innerText = "Registrar Horário";
    }
  </script>
</body>
</html>
